[package]
name = "detour-crowd-rs"
version = "0.1.0"
edition = "2024"
authors = ["Brandon Hubbard"]
description = "Pure Rust port of DetourCrowd from RecastNavigation: RVO collision avoidance, proximity grid, and crowd path steering"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bhubbard/detour-crowd-rs"
keywords = ["crowd", "navigation", "recast", "detour", "rvo"]
categories = ["game-development", "algorithms", "simulation"]

[dependencies]
glam = { version = "0.29", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"

[dev-dependencies]
serde_json = "1.0"
